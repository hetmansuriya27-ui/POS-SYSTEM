<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Revenue Statistics - X Hotel Staff</title>
    
    <link href="../css/styles.css?v=1.4" rel="stylesheet" />
    
    <!-- Firebase SDK Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="../js/admin-component-loader.js"></script>
    <style>
        .stats-container {
            background: var(--glass-panel) !important;
            backdrop-filter: blur(25px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(180%) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 20px !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4) !important;
            color: var(--text-primary) !important;
            padding: 25px;
            margin-bottom: 25px;
            min-height: 380px; /* Aligns height perfectly with the charts on the right */
        }
        .chart-box {
            background: var(--glass-panel) !important;
            backdrop-filter: blur(25px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(180%) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 20px !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4) !important;
            color: var(--text-primary) !important;
            padding: 20px;
            margin-bottom: 25px;
            min-height: 380px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .chart-box:hover {
            border-color: rgba(37, 99, 235, 0.25) !important;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 25px rgba(37, 99, 235, 0.08) !important;
        }
        .text-revenue {
            color: #10B981 !important; /* Emerald instead of dark forest green */
            font-weight: 800;
        }
        tr.table-info, tr.table-info > td, tr.table-info > th {
            background-color: rgba(37, 99, 235, 0.25) !important;
            color: #ffffff !important;
        }
        .btn-outline-dark {
            color: var(--text-secondary) !important;
            border-color: var(--glass-border) !important;
        }
        .btn-outline-dark:hover {
            background-color: var(--primary) !important;
            border-color: var(--primary) !important;
            color: white !important;
            box-shadow: 0 4px 15px var(--primary-glow) !important;
        }
    </style>
</head>
<body class="sb-nav-fixed">

    <div id="admin-header"></div>

    <div id="layoutSidenav_content" style="padding-top: 56px;">
        <main>
            <div class="container-fluid px-4 pt-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="font-weight-bold mt-2" style="color: var(--text-primary);">
                        <i class="fa fa-chart-line mr-2" style="color: #10B981;"></i> Revenue Statistics
                    </h2>
                    <button onclick="window.print();" class="btn btn-outline-dark font-weight-bold no-print">
                        <i class="fa fa-print mr-1"></i> Print Report
                    </button>
                </div>

                <div id="message-container"></div>

                <div class="row">
                    <!-- Left Side: Pricing metrics table -->
                    <div class="col-lg-5 mb-4">
                        <div class="stats-container">
                            <h4 class="font-weight-bold mb-4 text-center" style="color: var(--text-primary) !important;">Revenue Summary Metric</h4>
                            <table class="table table-hover mb-0" style="font-size: 1.05em;">
                                <thead>
                                    <tr>
                                        <th>Metric Timeframe</th>
                                        <th class="text-right">Amount (Rs)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="font-weight-bold">Total Revenue Today</td>
                                        <td class="text-right font-weight-bold text-revenue" id="rev-today">Rs 0.00</td>
                                    </tr>
                                    <tr>
                                        <td class="font-weight-bold">Total Revenue This Week</td>
                                        <td class="text-right font-weight-bold text-revenue" id="rev-week">Rs 0.00</td>
                                    </tr>
                                    <tr>
                                        <td class="font-weight-bold">Total Revenue This Month</td>
                                        <td class="text-right font-weight-bold text-revenue" id="rev-month">Rs 0.00</td>
                                    </tr>
                                    <tr class="table-info">
                                        <td class="font-weight-bold">Total Accumulated Revenue</td>
                                        <td class="text-right font-weight-bold" id="rev-total" style="font-size: 1.1em;">Rs 0.00</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Right Side: Cash vs Card vs UPI Revenue Charts -->
                    <div class="col-lg-7 mb-4">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="chart-box text-center">
                                    <h6 class="font-weight-bold mb-3" style="color: var(--text-secondary) !important;">Revenue Method Distribution</h6>
                                    <div style="height: 280px; position: relative;">
                                        <canvas id="methodBarChart"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="chart-box text-center">
                                    <h6 class="font-weight-bold mb-3" style="color: var(--text-secondary) !important;">Revenue Method Percentage</h6>
                                    <div style="height: 280px; position: relative;">
                                        <canvas id="methodPieChart"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/scripts.js" type="text/javascript"></script>
    <script>
        let billsCache = [];
        let barChartRef = null;
        let pieChartRef = null;

        document.addEventListener("DOMContentLoaded", function () {
            function initStatistics() {
                if (typeof firebase === 'undefined' || !window.db) {
                    setTimeout(initStatistics, 100);
                    return;
                }

                // Query paid bills in real time
                window.db.collection("bills")
                    .where("payment_time", "!=", null)
                    .onSnapshot(snapshot => {
                        billsCache = [];
                        snapshot.forEach(doc => {
                            billsCache.push(doc.data());
                        });

                        calculateRevenues();
                    }, err => console.error("Revenues listener failed:", err));
            }

            initStatistics();
        });

        function calculateRevenues() {
            const now = new Date();
            
            // Today boundary (Local Date matching)
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            // Week boundary (Monday start)
            const getMonday = (d) => {
                const date = new Date(d);
                const day = date.getDay();
                const diff = date.getDate() - day + (day === 0 ? -6 : 1); // adjust when day is sunday
                const monday = new Date(date.setDate(diff));
                monday.setHours(0,0,0,0);
                return monday;
            };
            const mondayLimit = getMonday(now);

            // Month boundary
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

            let totalToday = 0;
            let totalWeek = 0;
            let totalMonth = 0;
            let totalAll = 0;

            // Group payment methods map for current month
            let cardRevenue = 0;
            let cashRevenue = 0;
            let upiRevenue = 0;

            billsCache.forEach(bill => {
                const total = typeof bill.total_amount === 'number' ? bill.total_amount : 0;
                const payDate = new Date(bill.payment_time);
                
                // Cumulative All-Time
                totalAll += total;

                // Today
                const payDateStr = `${payDate.getFullYear()}-${String(payDate.getMonth() + 1).padStart(2, '0')}-${String(payDate.getDate()).padStart(2, '0')}`;
                if (payDateStr === todayStr) {
                    totalToday += total;
                }

                // This Week
                if (payDate >= mondayLimit) {
                    totalWeek += total;
                }

                // This Month
                if (payDate >= monthStart) {
                    totalMonth += total;

                    // Group payment method revenues for current month charts
                    const method = (bill.payment_method || "").toLowerCase();
                    if (method === "card") cardRevenue += total;
                    else if (method === "cash") cashRevenue += total;
                    else if (method === "upi") upiRevenue += total;
                }
            });

            // Populate table views
            document.getElementById("rev-today").textContent = `Rs ${totalToday.toFixed(2)}`;
            document.getElementById("rev-week").textContent = `Rs ${totalWeek.toFixed(2)}`;
            document.getElementById("rev-month").textContent = `Rs ${totalMonth.toFixed(2)}`;
            document.getElementById("rev-total").textContent = `Rs ${totalAll.toFixed(2)}`;

            // Render distribution charts
            renderCharts(cardRevenue, cashRevenue, upiRevenue);
        }

        function renderCharts(card, cash, upi) {
            const tickColor = '#64748B';
            const gridColor = 'rgba(0, 0, 0, 0.05)';

            // 1. Vertical Bar Chart
            if (barChartRef) barChartRef.destroy();
            const ctxBar = document.getElementById("methodBarChart").getContext('2d');
            
            if (card === 0 && cash === 0 && upi === 0) {
                ctxBar.font = "14px Inter";
                ctxBar.fillStyle = "#888";
                ctxBar.textAlign = "center";
                ctxBar.fillText("No transactions in current month", 140, 140);
            } else {
                barChartRef = new Chart(ctxBar, {
                    type: 'bar',
                    data: {
                        labels: ['Credit Card', 'Cash', 'UPI QR'],
                        datasets: [{
                            label: 'Revenue (Rs)',
                            data: [card, cash, upi],
                            backgroundColor: ['#2563EB', '#10B981', '#F59E0B'],
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { 
                                beginAtZero: true,
                                ticks: { color: tickColor },
                                grid: { color: gridColor }
                            },
                            x: {
                                ticks: { color: tickColor },
                                grid: { color: gridColor }
                            }
                        }
                    }
                });
            }

            // 2. Doughnut Chart
            if (pieChartRef) pieChartRef.destroy();
            const ctxPie = document.getElementById("methodPieChart").getContext('2d');

            if (card === 0 && cash === 0 && upi === 0) {
                ctxPie.font = "14px Inter";
                ctxPie.fillStyle = "#888";
                ctxPie.textAlign = "center";
                ctxPie.fillText("No transactions in current month", 140, 140);
            } else {
                pieChartRef = new Chart(ctxPie, {
                    type: 'doughnut',
                    data: {
                        labels: ['Credit Card', 'Cash', 'UPI QR'],
                        datasets: [{
                            data: [card, cash, upi],
                            backgroundColor: ['#2563EB', '#10B981', '#F59E0B'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { 
                                position: 'bottom',
                                labels: { color: tickColor }
                            }
                        }
                    }
                });
            }
        }


    </script>
</body>
</html>
