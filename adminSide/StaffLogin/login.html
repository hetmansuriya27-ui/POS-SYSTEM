<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Login - X Hotel</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Firebase SDK Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
    </script>

    <style>
         @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap');

         body {
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 45%),
                radial-gradient(at 100% 0%, rgba(79, 70, 229, 0.05) 0px, transparent 45%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .wrapper {
            width: 380px;
            padding: 40px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .wrapper:hover {
            border-color: rgba(37, 99, 235, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 0 30px rgba(37, 99, 235, 0.03);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
            margin-bottom: 25px;
            color: #0f172a;
        }

        .form-control {
            background-color: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 12px !important;
            color: #0f172a !important;
            padding: 12px 18px !important;
            height: auto !important;
            transition: all 0.2s ease !important;
        }

        .form-control:focus {
            background-color: #ffffff !important;
            border-color: #2563EB !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
            color: #0f172a !important;
        }

        .btn-light {
            width: 100% !important;
            background-color: #2563EB !important;
            border-color: #2563EB !important;
            color: white !important;
            border-radius: 12px !important;
            font-weight: 600 !important;
            padding: 12px 20px !important;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.15) !important;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }

        .btn-light:hover {
            background-color: #1d4ed8 !important;
            border-color: #1d4ed8 !important;
            color: white !important;
            transform: translateY(-2px) scale(1.02) !important;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.2) !important;
        }
        
        label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
        }
        
        .text-danger {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <p>&nbsp;&nbsp;&nbsp;</p> 
    <section id="signup">
    <div class="container my-6">
        <a class="nav-link" href="../../customerSide/home/home.html"> 
            <h1 class="text-center" style="font-family:Copperplate; color:#0f172a;"> X HOTEL</h1>
        </a>

        <div class="wrapper">
            <div id="error-banner" class="alert alert-danger" style="display: none; background-color: rgba(239, 68, 68, 0.1); color: #b91c1c; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; font-weight: 500; font-size: 14px;"></div>

            <form id="staff-login-form">
                <div class="form-group">
                    <label for="account_id">Staff Account ID</label>
                    <input type="number" id="account_id" placeholder="Enter Account ID" required class="form-control">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Enter Password" required class="form-control">
                        <div class="input-group-append">
                            <button class="btn btn-light" type="button" id="togglePassword" style="border: 1px solid #ced4da; border-left: none;">
                                <i class="fa fa-eye-slash" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
                    
                <div class="form-group">
                    <button class="btn btn-light" type="submit" id="submit-btn">Login</button>
                </div>
            </form>
        </div>
    </div>
    </section>

    <script>
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');

    togglePassword.addEventListener('click', function (e) {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    });

    document.getElementById("staff-login-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const accountId = document.getElementById("account_id").value;
        const password = document.getElementById("password").value;
        const errorBanner = document.getElementById("error-banner");
        const submitBtn = document.getElementById("submit-btn");

        errorBanner.style.display = "none";
        errorBanner.textContent = "";

        if (!window.db) {
            errorBanner.style.display = "block";
            errorBanner.textContent = "Firebase is initializing. Please wait a moment.";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Verifying...";

        try {
            // Query Firestore 'users' collection for the matching account_id
            const doc = await window.db.collection("users").doc(accountId.toString()).get();

            if (doc.exists) {
                const userData = doc.data();

                // Verify plain-text password matching (as in legacy seeder PHP files)
                if (userData.password === password) {
                    
                    // Verify if they are indeed staff (role cannot be 'Member')
                    if (userData.role !== "Member") {
                        // Success! Save session
                        localStorage.setItem("logged_account_id", accountId);
                        localStorage.setItem("logged_staff_name", userData.name || "Staff");
                        localStorage.setItem("logged_staff_role", userData.role);
                        
                        if (userData.role === "Chef") {
                            window.location.href = "../panel/kitchen-panel.html";
                        } else {
                            window.location.href = "../panel/pos-panel.html";
                        }
                    } else {
                        // User is a member, not staff
                        errorBanner.style.display = "block";
                        errorBanner.textContent = "Staff ID not found. Only restaurant staff can log in here.";
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Login";
                    }
                } else {
                    errorBanner.style.display = "block";
                    errorBanner.textContent = "Incorrect password. Please try again.";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Login";
                }
            } else {
                errorBanner.style.display = "block";
                errorBanner.textContent = "Staff ID not found. Please try again to choose a correct Staff ID.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Login";
            }
        } catch (err) {
            console.error("Staff login error:", err);
            errorBanner.style.display = "block";
            errorBanner.textContent = "Connection error. Please try again later.";
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
        }
    });
    </script>
</body>
</html>
