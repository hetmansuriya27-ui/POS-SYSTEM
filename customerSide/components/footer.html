  <script type="text/javascript">
  $(document).ready(function(){
      // Set current year dynamically
      $("#footer-year").text(new Date().getFullYear());

      // Bind dynamic select change for menu filtering
      $(document).on("change", "select#menu-category", function(){
          var val = $(this).find("option:selected").val();
          if(val){
              $(".msg").not("." + val).hide();
              $("." + val).show();
          } else{
              $(".msg").hide();
          }
      });

      // Bind search filter
      function filterMenuItems(searchTerm) {
        $(".item-name").each(function() {
          var itemName = $(this).text().toLowerCase();
          if (itemName.includes(searchTerm)) {
            $(this).closest("p").show(); // Show item paragraph
          } else {
            $(this).closest("p").hide(); // Hide item paragraph
          }
        });
      }
      
      $(document).on("click", "#search-button", function() {
        var searchTerm = $("#search-input").val().toLowerCase();
        filterMenuItems(searchTerm);
      });
      
      $(document).on("keyup", "#search-input", function() {
        var searchTerm = $(this).val().toLowerCase();
        filterMenuItems(searchTerm);
      });

      // Tooltip positioning
      $(document).on("mouseenter", ".logout-link-container", function(){
        var $tooltip = $(this).find('.tooltip');
        $tooltip.css('display', 'block');
      }).on("mouseleave", ".logout-link-container", function(){
        $(this).find('.tooltip').css('display', 'none');
      });
  });
  </script>
