<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css?v=1.1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Firebase SDK Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
    <script>
        // Dynamically load the correct Firebase configuration depending on the domain
        const isOrderingSite = window.location.hostname.includes("pos-system-1276b-75869");
        const configScript = document.createElement("script");
        configScript.src = isOrderingSite ? "../js/firebase-config-ordering.js" : "../js/firebase-config.js";
        document.head.appendChild(configScript);

        // Add class immediately to body/html to hide navbar before rendering
        if (isOrderingSite) {
            document.documentElement.classList.add("is-ordering-site");
        }
    </script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="../js/component-loader.js"></script>

    <title>Order At Table - X Hotel</title>
    <style>
        /* CSS overrides for ordering site */
        .is-ordering-site #header,
        .is-ordering-site section#header,
        .is-ordering-site #footer,
        .is-ordering-site footer#footer {
            display: none !important;
        }
        .is-ordering-site .container {
            margin-top: 0px !important;
            min-height: 100vh !important;
        }

        body {
            font-family: 'Montserrat', sans-serif !important;
            background-color: var(--bg-workspace) !important;
        }
        .custom-card {
            background: var(--glass-panel) !important;
            color: var(--text-primary) !important;
            border: 2px solid crimson !important;
            border-radius: 12px;
            box-shadow: 0px 0px 20px rgba(220, 20, 60, 0.15);
        }
        .cta-btn {
            background-color: transparent;
            color: var(--text-primary) !important;
            border: 2px solid crimson;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            transition: 0.3s ease;
            font-weight: bold;
        }
        .cta-btn:hover {
            background-color: crimson;
            color: white !important;
            box-shadow: 0px 0px 10px rgba(220, 20, 60, 0.4);
        }
        .form-control-custom {
            background: var(--bg-workspace) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-primary) !important;
            font-size: 1.4rem;
            height: 45px;
        }
        .form-control-custom:focus {
            background: var(--bg-workspace) !important;
            border-color: crimson !important;
            color: var(--text-primary) !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 20, 60, 0.25) !important;
        }
    </style>
</head>
<body>

  <!-- Dynamic Header Container (Injected by component-loader.js) -->
  <div id="header"></div>

  <div class="container" style="margin-top: 12rem; margin-bottom: 8rem; min-height: 70vh; display: flex; align-items: center; justify-content: center;">
      <div class="row justify-content-center w-100">
          <div class="col-md-6 col-lg-5">
              <div class="card custom-card p-4">
                  <div class="text-center pb-3 mb-4" style="border-bottom: 1px solid var(--glass-border) !important;">
                      <h2 class="my-2" style="font-family: 'Montserrat', sans-serif; font-size: 2.6rem; font-weight: 700; letter-spacing: 0.1rem; text-transform: uppercase;">
                          Order <span style="color: crimson;">At Table</span>
                      </h2>
                      <p class="text-muted mb-0" style="font-size: 1.3rem;">Please fill in your details to begin</p>
                  </div>
                  <div class="card-body p-0">
                      <div id="error-msg" class="alert alert-danger" style="display: none; background-color: rgba(220, 20, 60, 0.2); color: #f8d7da; border: 1px solid crimson; font-size: 1.3rem;"></div>
                      
                      <form id="customer-order-form">
                          <div class="form-group mb-3">
                              <label class="form-label" style="font-weight: 600; color: var(--text-primary); font-size: 1.3rem;">Table Number:</label>
                              <input type="number" min="1" id="table_id" class="form-control form-control-custom" placeholder="e.g. 1" required>
                          </div>
                          <div class="form-group mb-3">
                              <label class="form-label" style="font-weight: 600; color: var(--text-primary); font-size: 1.3rem;">Your Name:</label>
                              <input type="text" id="customer_name" class="form-control form-control-custom" placeholder="e.g. John Doe" required>
                          </div>
                          <div class="form-group mb-4">
                              <label class="form-label" style="font-weight: 600; color: var(--text-primary); font-size: 1.3rem;">Mobile Number:</label>
                              <input type="text" id="customer_mobile" class="form-control form-control-custom" placeholder="e.g. +60123456789" required>
                          </div>
                          <button type="submit" id="submit-btn" class="btn btn-block cta-btn py-2">Enter Menu</button>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <!-- Dynamic Footer Container (Injected by component-loader.js) -->
  <div id="footer"></div>

  <script>
      document.addEventListener("DOMContentLoaded", function () {
          // Dynamically hide header/footer and center the card if on ordering site
          const isOrdering = window.location.hostname.includes("pos-system-1276b-75869");
          if (isOrdering) {
              const header = document.getElementById("header");
              if (header) header.style.display = "none";
              const footer = document.getElementById("footer");
              if (footer) footer.style.display = "none";
              
              const container = document.querySelector(".container");
              if (container) {
                  container.style.setProperty("margin-top", "0px", "important");
                  container.style.setProperty("min-height", "100vh", "important");
              }
          }

          // Pre-fill Name & Phone if they are logged in
          function prefillMemberDetails() {
              const memberName = localStorage.getItem("user_name") || localStorage.getItem("member_name");
              if (memberName) {
                  document.getElementById("customer_name").value = memberName;
              }
              // If they are authenticated via Firebase Auth, we could also fetch their phone number from Firestore if available
              if (window.auth) {
                  window.auth.onAuthStateChanged(async function(user) {
                      if (user) {
                          try {
                              const q = await window.db.collection("users").where("email", "==", user.email).limit(1).get();
                              if (!q.empty) {
                                  const data = q.docs[0].data();
                                  document.getElementById("customer_name").value = data.name || user.email.split('@')[0];
                                  document.getElementById("customer_mobile").value = data.phone_number || "";
                              }
                          } catch (err) {
                              console.warn("Failed to prefill phone details:", err);
                          }
                      }
                  });
              }
          }
          
          setTimeout(prefillMemberDetails, 300);

          document.getElementById("customer-order-form").addEventListener("submit", async function (e) {
              e.preventDefault();

              const tableId = document.getElementById("table_id").value;
              const customerName = document.getElementById("customer_name").value.trim();
              const customerMobile = document.getElementById("customer_mobile").value.trim();
              const errorDiv = document.getElementById("error-msg");
              const submitBtn = document.getElementById("submit-btn");

              errorDiv.style.display = "none";
              errorDiv.textContent = "";

              if (!window.db) {
                  errorDiv.style.display = "block";
                  errorDiv.textContent = "Database is initializing. Please wait a moment.";
                  return;
              }

              submitBtn.disabled = true;
              submitBtn.textContent = "Verifying Table...";

              try {
                  // Query Firestore 'tables' collection to verify if table exists
                  const tableDoc = await window.db.collection("tables").doc(tableId).get();

                  if (tableDoc.exists) {
                      // Table exists! Save to localStorage session
                      localStorage.setItem("customer_table_id", tableId);
                      localStorage.setItem("customer_name", customerName);
                      localStorage.setItem("customer_mobile", customerMobile);
                      
                      // Clear any existing customer cart to start fresh
                      localStorage.removeItem("customer_cart");
                      
                      const isOrderingSiteUrl = window.location.hostname.includes("pos-system-1276b-75869");
                      window.location.href = isOrderingSiteUrl ? "customerOrdering.html" : "customerMenu.html";
                  } else {
                      errorDiv.style.display = "block";
                      errorDiv.textContent = "Table number does not exist. Please enter a valid Table ID.";
                      submitBtn.disabled = false;
                      submitBtn.textContent = "Enter Menu";
                  }
              } catch (err) {
                  console.error("Table validation error:", err);
                  errorDiv.style.display = "block";
                  errorDiv.textContent = "Connection error. Please try again.";
                  submitBtn.disabled = false;
                  submitBtn.textContent = "Enter Menu";
              }
          });
      });
  </script>
</body>
</html>
