<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - X Hotel</title>
    <link rel="stylesheet" href="../css/style.css?v=1.1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Firebase SDK Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/component-loader.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif !important;
            color: var(--text-primary) !important;
            background-color: var(--bg-workspace) !important;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-container {
            width: 420px;
            padding: 40px;
            background: var(--glass-panel) !important;
            backdrop-filter: blur(25px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(180%) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 24px !important;
            box-shadow: var(--shadow-card) !important;
            margin: auto !important;
            max-width: 500px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-container:hover {
            border-color: crimson !important;
        }

        .login_wrapper {
            width: 100% !important;
            padding: 0 !important;
        }

        h2 {
            font-family: 'Outfit', sans-serif !important;
            font-weight: 700 !important;
            text-align: center;
            letter-spacing: -0.02em;
            margin-bottom: 25px;
            color: var(--text-primary) !important;
        }

        p {
            font-family: 'Inter', sans-serif !important;
            color: var(--text-secondary) !important;
        }

        .form-control {
            background-color: var(--bg-workspace) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            padding: 12px 18px !important;
            height: auto !important;
            transition: all 0.2s ease !important;
        }

        .form-control:focus {
            background-color: var(--bg-workspace) !important;
            border-color: crimson !important;
            box-shadow: 0 0 0 3px rgba(220, 20, 60, 0.2) !important;
            color: var(--text-primary) !important;
        }

        .btn-dark {
            width: 100% !important;
            background-color: transparent !important;
            border: 2px solid crimson !important;
            color: var(--text-primary) !important;
            border-radius: 12px !important;
            font-weight: 600 !important;
            padding: 12px 20px !important;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }

        .btn-dark:hover {
            background-color: crimson !important;
            color: white !important;
            transform: translateY(-2px) scale(1.02) !important;
            box-shadow: 0px 0px 12px rgba(220, 20, 60, 0.5) !important;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary) !important;
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        ::placeholder {
            font-size: 12px;
        }
        
        .text-danger {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-container">
    <div class="login_wrapper">
        <a class="nav-link" href="../home/home.html#hero"> 
            <h1 class="text-center" style="font-family:Copperplate; color:var(--text-primary) !important;"> X HOTEL</h1>
        </a>
    
        <div class="wrapper">
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter User Email" required>
                <span class="text-danger" id="email-error"></span>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="Enter User Password" required>
                    <div class="input-group-append">
                        <button class="btn btn-dark" type="button" id="togglePassword" style="border: 1px solid var(--glass-border); border-left: none; background-color: var(--bg-workspace) !important; color: var(--text-primary) !important;">
                            <i class="fa fa-eye-slash" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <span class="text-danger" id="password-error"></span>
            </div>
            
            <button class="btn btn-dark" type="submit" id="submit-btn">Login</button>
        </form>

        <p style="margin-top:1em; color: var(--text-primary) !important;">Don't have an account? <a href="register.html">Proceed to Register</a></p>
        </div>
    </div>
    </div>

    <script>
    // Eye icon toggle for password
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');

    togglePassword.addEventListener('click', function (e) {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    });

    // Form submission using Firebase Auth and seamless Legacy migration
    document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const emailError = document.getElementById("email-error");
        const passwordError = document.getElementById("password-error");
        const submitBtn = document.getElementById("submit-btn");

        // Reset errors
        emailError.textContent = "";
        passwordError.textContent = "";

        if (!window.auth || !window.db) {
            passwordError.textContent = "Firebase is initializing. Please wait a moment and try again.";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        // 1. Try Standard Firebase Auth login
        window.auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                console.log("Logged in successfully via Firebase Auth.");
                window.location.href = "../home/home.html";
            })
            .catch((error) => {
                console.log("Firebase Auth failed, checking legacy credentials...", error.code);
                
                // 2. If Auth fails (e.g. user not found or wrong password), check if they exist in legacy seed collection
                window.db.collection("users")
                    .where("email", "==", email)
                    .limit(1)
                    .get()
                    .then((querySnapshot) => {
                        if (!querySnapshot.empty) {
                            const userDoc = querySnapshot.docs[0];
                            const userData = userDoc.data();

                            // Compare with plaintext legacy password
                            if (userData.password === password) {
                                // Password matches legacy seed record!
                                // Automatically migrate user by creating them in Firebase Auth
                                console.log("Legacy user found. Migrating to Firebase Auth...");
                                
                                window.auth.createUserWithEmailAndPassword(email, password)
                                    .then((newUserCredential) => {
                                        console.log("Legacy user successfully migrated to Firebase Auth!");
                                        window.location.href = "../home/home.html";
                                    })
                                    .catch((regError) => {
                                        console.error("Migration signup failed:", regError);
                                        // If email already exists in Auth under different status, just force standard login err
                                        passwordError.textContent = "Authentication error. Please contact support.";
                                        submitBtn.disabled = false;
                                        submitBtn.textContent = "Login";
                                    });
                            } else {
                                // User exists in DB but password was wrong
                                passwordError.textContent = "Invalid password. Please try again.";
                                submitBtn.disabled = false;
                                submitBtn.textContent = "Login";
                            }
                        } else {
                            // User not found in Firestore either
                            emailError.textContent = "No account found with this email.";
                            submitBtn.disabled = false;
                            submitBtn.textContent = "Login";
                        }
                    })
                    .catch((dbErr) => {
                        console.error("Firestore lookup error:", dbErr);
                        passwordError.textContent = "Database error. Please try again later.";
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Login";
                    });
            });
    });
    </script>
</body>
</html>
