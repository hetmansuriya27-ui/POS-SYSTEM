<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registration Successful</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,400i,700,900&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            padding: 40px 0;
            background: #EBF0F5;
        }
        h1 {
            color: #88B04B;
            font-family: "Nunito Sans", "Helvetica Neue", sans-serif;
            font-weight: 900;
            font-size: 40px;
            margin-bottom: 10px;
        }
        p {
            color: #404F5E;
            font-family: "Nunito Sans", "Helvetica Neue", sans-serif;
            font-size: 20px;
            margin: 0;
        }
        i.checkmark {
            color: #5DBE6F;
            font-size: 100px;
            line-height: 200px;
            margin-left: -15px;
        }
        .card {
            background: white;
            padding: 60px;
            border-radius: 4px;
            box-shadow: 0 2px 3px #C8D0D8;
            display: inline-block;
            margin: 0 auto;
        }
        .alert-success {
            background-color: #D4F4DD;
        }
        .alert-success i {
            color: #5DBE6F;
        }
        .alert-box {
            max-width: 300px;
            margin: 0 auto;
        }
        .alert-icon {
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card alert-success">
        <div style="border-radius: 200px; height: 200px; width: 200px; background: #F8FAF5; margin: 0 auto;">
            <i class="checkmark">✓</i>
        </div>
        <h1>Success</h1>
        <p>Register successful.<br>Welcome to X Hotel.<br>Please Login with your Account.</p>
    </div>

    <div style="text-align: center; margin-top: 20px; font-family: 'Nunito Sans', sans-serif;">
        Redirecting back in <span id="countdown" style="font-weight: bold;">3</span>...
    </div>

    <script>
        var direction = "login.html";
        
        function showPopup() {
            var i = 3;
            var countdownElement = document.getElementById("countdown");
            var countdownInterval = setInterval(function() {
                i--;
                countdownElement.textContent = i;
                if (i <= 0) {
                    clearInterval(countdownInterval);
                    window.location.href = direction;
                }
            }, 1000);
        }

        window.onload = showPopup;
    </script>
</body>
</html>
